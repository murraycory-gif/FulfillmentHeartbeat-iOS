name: Cook Heartbeat pack

# Turns Heartbeat Daily Report.xlsx in Supabase into current.sqlite.
# Testers never parse Excel. Cory's Mac does not need to be on.
# Company pack goes LIVE before parallel seat uploads.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [cook-heartbeat-pack]
  schedule:
    - cron: "*/2 * * * *"
    - cron: "0 6 * * *"

concurrency:
  group: cook-heartbeat-pack
  cancel-in-progress: false

jobs:
  cook:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download workbook from Supabase
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
        run: |
          set -euo pipefail
          list_prefix() {
            curl -sS --connect-timeout 15 --max-time 60 -X POST \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prefix\":\"$1\",\"limit\":20}" \
              "$PROJECT/storage/v1/object/list/heartbeat-packs"
          }
          list_prefix "Heartbeat Daily Report.xlsx" > /tmp/xlsx-list.json
          list_prefix "current.sqlite" > /tmp/sqlite-list.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          def rows(path):
              raw = json.load(open(path))
              if isinstance(raw, dict):
                  raise SystemExit(f"{path}: {raw}")
              return raw

          def named(items, want):
              for row in items:
                  if row.get("name") == want:
                      return row
              return None

          def parse_ts(row):
              if not row:
                  return None
              raw = row.get("updated_at") or row.get("created_at") or ""
              if not raw:
                  return None
              raw = raw.replace("Z", "+00:00")
              try:
                  dt = datetime.fromisoformat(raw)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt

          def size_of(row):
              if not row:
                  return 0
              meta = row.get("metadata") or {}
              return int(meta.get("size") or 0)

          xlsx = named(rows("/tmp/xlsx-list.json"), "Heartbeat Daily Report.xlsx")
          pack = named(rows("/tmp/sqlite-list.json"), "current.sqlite")
          if not xlsx:
              raise SystemExit("No Heartbeat Daily Report.xlsx in the bucket.")
          xlsx_dt = parse_ts(xlsx)
          pack_dt = parse_ts(pack)
          pack_bytes = size_of(pack)
          event = os.environ.get("GITHUB_EVENT_NAME") or ""
          force = event in ("workflow_dispatch", "repository_dispatch")
          print(f"xlsx {xlsx.get('updated_at')} sqlite { (pack or {}).get('updated_at')} sqlite_bytes={pack_bytes} force={force}")
          if xlsx_dt and pack_dt:
              print(f"xlsx_dt {xlsx_dt.isoformat()} sqlite_dt {pack_dt.isoformat()} newer={xlsx_dt > pack_dt}")
          # 1MB floor: a 413/TUS stub can bump updated_at with a tiny object.
          # Never treat that as a fresh cook.
          if not force and xlsx_dt and pack_dt and xlsx_dt <= pack_dt and pack_bytes >= 1_000_000:
              open("/tmp/skip", "w").write("1")
              print("Pack is already newer than the workbook. Skip.")
          PY
          if [ -f /tmp/skip ]; then
            echo "skip=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Mac-proven authenticated object URL. Public / bare object path can be empty/tiny.
          CODE=$(curl -sS -L --connect-timeout 20 --max-time 180 \
            -o /tmp/daily.xlsx -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            "$PROJECT/storage/v1/object/authenticated/heartbeat-packs/Heartbeat%20Daily%20Report.xlsx")
          if [ "$CODE" != "200" ]; then
            echo "Workbook download failed ($CODE)."
            exit 1
          fi
          BYTES=$(wc -c < /tmp/daily.xlsx | tr -d ' ')
          ls -l /tmp/daily.xlsx
          if [ "$BYTES" -lt 1048576 ]; then
            echo "Workbook too small ($BYTES bytes). Need authenticated Heartbeat Daily Report.xlsx >= 1MB."
            exit 1
          fi

      - name: Build kitchen
        if: env.skip != '1'
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/prepare-sources.sh
          cd Tools/HeartbeatIngest
          swift build -c release

      - name: Cook sqlite pack
        if: env.skip != '1'
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/.build/release/HeartbeatIngest /tmp/daily.xlsx /tmp/current.sqlite
          ls -l /tmp/current.sqlite
          test -f /tmp/packs/manifest.json
          test -f /tmp/packs/seat/company/all/current.sqlite
          MARKET_BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          COMPANY_BYTES=$(wc -c < /tmp/packs/seat/company/all/current.sqlite | tr -d ' ')
          echo "market=$MARKET_BYTES bytes company_seat=$COMPANY_BYTES bytes"
          if [ "$COMPANY_BYTES" -lt 1048576 ]; then
            echo "Company seat too small ($COMPANY_BYTES). Cook refused to publish."
            exit 1
          fi
          DISTRICT_N=$(find /tmp/packs/seat/district -name current.sqlite | wc -l | tr -d ' ')
          STORE_N=$(find /tmp/packs/seat/store -name current.sqlite | wc -l | tr -d ' ')
          echo "seat districts=$DISTRICT_N stores=$STORE_N"
          if [ "$DISTRICT_N" -lt 1 ] || [ "$STORE_N" -lt 1 ]; then
            echo "Cook must write every district and store seat sqlite."
            exit 1
          fi

      - name: Fold schedule rows into the sqlite pack
        if: env.skip != '1'
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
        run: |
          set +e
          CODE=$(curl -sS --connect-timeout 15 --max-time 60 -o /tmp/sched-list.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"Schedule Review","limit":50}' \
            "$PROJECT/storage/v1/object/list/heartbeat-packs")
          if [ "$CODE" != "200" ]; then
            echo "schedule fold skipped: workbook list failed ($CODE)"
            exit 0
          fi
          python3 - <<'PY'
          import json
          raw = json.load(open("/tmp/sched-list.json"))
          names = []
          if isinstance(raw, list):
              for row in raw:
                  name = row.get("name") or ""
                  if name.startswith("~$"):
                      continue
                  if name.startswith("Schedule Review Week ") and name.endswith(".xlsx"):
                      names.append(name)
          open("/tmp/sched-name.txt","w").write(names[0] if names else "")
          PY
          NAME=$(cat /tmp/sched-name.txt)
          if [ -z "$NAME" ]; then
            echo "schedule fold skipped: no Schedule Review Week workbook"
            exit 0
          fi
          ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$NAME")
          DL=$(curl -sS -L --connect-timeout 20 --max-time 180 -o /tmp/schedule.xlsx -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            "$PROJECT/storage/v1/object/authenticated/heartbeat-packs/$ENC")
          if [ "$DL" != "200" ]; then
            echo "schedule fold skipped: workbook download failed ($DL)"
            exit 0
          fi
          python3 -m pip install --quiet openpyxl
          python3 Tools/ScheduleCheck/cook_schedule.py /tmp/schedule.xlsx --sqlite /tmp/current.sqlite \
            || echo "schedule fold skipped: current.sqlite was not updated"
          if [ -f /tmp/packs/seat/company/all/current.sqlite ]; then
            python3 Tools/ScheduleCheck/cook_schedule.py /tmp/schedule.xlsx --sqlite /tmp/packs/seat/company/all/current.sqlite \
              || echo "schedule fold skipped: company seat was not updated"
          fi
          exit 0

      - name: Publish company LIVE
        if: env.skip != '1'
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/publish-cloud.sh company /tmp/current.sqlite
          echo "company_live=1" >> "$GITHUB_ENV"

      - name: Publish seat packs
        if: env.skip != '1'
        continue-on-error: true
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
          SEAT_JOBS: "16"
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/publish-cloud.sh seats /tmp/current.sqlite

      - name: Notify devices
        if: env.skip != '1' && env.company_live == '1'
        continue-on-error: true
        env:
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: com.corymurray.FulfillmentHeartbeat
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_LIST_SECRET: ${{ secrets.PUSH_LIST_SECRET }}
        run: python3 Tools/HeartbeatPush/send_push.py /tmp/packs/seat/company/all/current.sqlite

  # Separate from `cook`. No `needs:`. A missing or failed schedule file
  # does not stop the Heartbeat pack. The live watcher is the Mac LaunchAgent.
  cook-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cook schedule pack when the workbook is in the bucket
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -u
          CODE=$(curl -sS --connect-timeout 15 --max-time 60 -o /tmp/sched-list.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"Schedule Review","limit":50}' \
            "$PROJECT/storage/v1/object/list/heartbeat-packs" || echo "000")
          if [ "$CODE" != "200" ]; then
            echo "Schedule workbook list failed ($CODE). Heartbeat cook is independent."
            exit 0
          fi
          python3 - <<'PY'
          import json
          raw = json.load(open("/tmp/sched-list.json"))
          names = []
          if isinstance(raw, list):
              for row in raw:
                  name = row.get("name") or ""
                  if name.startswith("~$"):
                      continue
                  if name.startswith("Schedule Review Week ") and name.endswith(".xlsx"):
                      names.append(name)
          open("/tmp/sched-name.txt","w").write(names[0] if names else "")
          print("schedule workbook:", names[0] if names else "(none)")
          PY
          NAME=$(cat /tmp/sched-name.txt)
          if [ -z "$NAME" ]; then
            echo "No Schedule Review Week workbook in the bucket. The Mac iCloud cook owns this file."
            exit 0
          fi
          ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$NAME")
          DL=$(curl -sS -L --connect-timeout 20 --max-time 180 -o /tmp/schedule.xlsx -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            "$PROJECT/storage/v1/object/authenticated/heartbeat-packs/$ENC" || echo "000")
          if [ "$DL" != "200" ]; then
            echo "Schedule workbook download failed ($DL). Heartbeat cook is independent."
            exit 0
          fi
          python3 -m pip install --quiet openpyxl
          if ! python3 Tools/ScheduleCheck/cook_schedule.py /tmp/schedule.xlsx /tmp/schedule-check.json --check; then
            echo "schedule cook failed (heartbeat cook is independent)"
            exit 0
          fi
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ENDPOINT:-}" ]; then
            echo "schedule publish skipped: no r2 key"
            exit 0
          fi
          # The pack is current.sqlite. Do not upload schedule-check.json as the pack.
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            aws s3 cp "s3://${R2_BUCKET}/current.sqlite" /tmp/current.sqlite \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            || echo "schedule pack download failed (heartbeat cook is independent)"
          if [ -f /tmp/current.sqlite ]; then
            python3 Tools/ScheduleCheck/cook_schedule.py /tmp/schedule.xlsx --sqlite /tmp/current.sqlite \
              || echo "schedule sqlite write failed (heartbeat cook is independent)"
            AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
              aws s3 cp /tmp/current.sqlite "s3://${R2_BUCKET}/current.sqlite" \
                --endpoint-url "$R2_ENDPOINT" --only-show-errors \
              || echo "schedule pack publish failed (heartbeat cook is independent)"
          fi
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            aws s3 cp "s3://${R2_BUCKET}/packs/seat/company/all/current.sqlite" /tmp/company-seat.sqlite \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            || true
          if [ -f /tmp/company-seat.sqlite ]; then
            python3 Tools/ScheduleCheck/cook_schedule.py /tmp/schedule.xlsx --sqlite /tmp/company-seat.sqlite \
              || echo "company seat schedule write failed (heartbeat cook is independent)"
            AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
              aws s3 cp /tmp/company-seat.sqlite "s3://${R2_BUCKET}/packs/seat/company/all/current.sqlite" \
                --endpoint-url "$R2_ENDPOINT" --only-show-errors \
              || echo "company seat publish failed (heartbeat cook is independent)"
          fi
          exit 0
