name: Cook Heartbeat pack

# Turns Heartbeat Daily Report.xlsx (still in Supabase Storage) into
# current.sqlite + seat packs, then publishes them to Cloudflare R2.
# Testers never parse Excel. Cory's Mac does not need to be on.
# Company pack goes LIVE before seat uploads.
#
# Schedule: 0 * * * * (hourly, UTC). The workbook updates about once a day.
# Hourly is enough for testers and stays egress-friendly on R2's free tier.
# Previous tip ran every 2 minutes (*/2) plus a 06:00 backup.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [cook-heartbeat-pack]
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: cook-heartbeat-pack
  cancel-in-progress: false

jobs:
  cook:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download workbook from Supabase
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
          PACK_HOST: https://pub-eafb309f53464d98902d12ac107f0f1e.r2.dev
        run: |
          set -euo pipefail
          list_prefix() {
            curl -sS --connect-timeout 15 --max-time 60 -X POST \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prefix\":\"$1\",\"limit\":20}" \
              "$PROJECT/storage/v1/object/list/heartbeat-packs"
          }
          list_prefix "Heartbeat Daily Report.xlsx" > /tmp/xlsx-list.json
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          def rows(path):
              raw = json.load(open(path))
              if isinstance(raw, dict):
                  raise SystemExit(f"{path}: {raw}")
              return raw

          def named(items, want):
              for row in items:
                  if row.get("name") == want:
                      return row
              return None

          def parse_ts(raw):
              if not raw:
                  return None
              try:
                  dt = parsedate_to_datetime(raw)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt
              except Exception:
                  pass
              raw = raw.replace("Z", "+00:00")
              try:
                  dt = datetime.fromisoformat(raw)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt

          def parse_row_ts(row):
              if not row:
                  return None
              return parse_ts(row.get("updated_at") or row.get("created_at") or "")

          xlsx = named(rows("/tmp/xlsx-list.json"), "Heartbeat Daily Report.xlsx")
          if not xlsx:
              raise SystemExit("No Heartbeat Daily Report.xlsx in the bucket.")
          xlsx_dt = parse_row_ts(xlsx)
          pack_host = os.environ.get("PACK_HOST", "").rstrip("/")
          pack_updated = ""
          pack_bytes = 0
          try:
              req = urllib.request.Request(f"{pack_host}/current.sqlite", method="HEAD")
              with urllib.request.urlopen(req, timeout=20) as resp:
                  pack_updated = resp.headers.get("Last-Modified") or ""
                  pack_bytes = int(resp.headers.get("Content-Length") or 0)
          except Exception as exc:
              print(f"R2 HEAD current.sqlite: {exc}")
          pack_dt = parse_ts(pack_updated)
          event = os.environ.get("GITHUB_EVENT_NAME") or ""
          force = event in ("workflow_dispatch", "repository_dispatch")
          print(f"xlsx {xlsx.get('updated_at')} r2 {pack_updated} sqlite_bytes={pack_bytes} force={force}")
          if xlsx_dt and pack_dt:
              print(f"xlsx_dt {xlsx_dt.isoformat()} r2_dt {pack_dt.isoformat()} newer={xlsx_dt > pack_dt}")
          # 1MB floor: never treat a stub/empty R2 object as a fresh cook.
          if not force and xlsx_dt and pack_dt and xlsx_dt <= pack_dt and pack_bytes >= 1_000_000:
              open("/tmp/skip", "w").write("1")
              print("Pack is already newer than the workbook. Skip.")
          PY
          if [ -f /tmp/skip ]; then
            echo "skip=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Mac-proven authenticated object URL. Public / bare object path can be empty/tiny.
          CODE=$(curl -sS -L --connect-timeout 20 --max-time 180 \
            -o /tmp/daily.xlsx -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            "$PROJECT/storage/v1/object/authenticated/heartbeat-packs/Heartbeat%20Daily%20Report.xlsx")
          if [ "$CODE" != "200" ]; then
            echo "Workbook download failed ($CODE)."
            exit 1
          fi
          BYTES=$(wc -c < /tmp/daily.xlsx | tr -d ' ')
          ls -l /tmp/daily.xlsx
          if [ "$BYTES" -lt 1048576 ]; then
            echo "Workbook too small ($BYTES bytes). Need authenticated Heartbeat Daily Report.xlsx >= 1MB."
            exit 1
          fi

      - name: Build kitchen
        if: env.skip != '1'
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/prepare-sources.sh
          cd Tools/HeartbeatIngest
          swift build -c release

      - name: Cook sqlite pack
        if: env.skip != '1'
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/.build/release/HeartbeatIngest /tmp/daily.xlsx /tmp/current.sqlite
          ls -l /tmp/current.sqlite
          test -f /tmp/packs/manifest.json
          test -f /tmp/packs/seat/company/all/current.sqlite
          MARKET_BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          COMPANY_BYTES=$(wc -c < /tmp/packs/seat/company/all/current.sqlite | tr -d ' ')
          echo "market=$MARKET_BYTES bytes company_seat=$COMPANY_BYTES bytes"
          if [ "$COMPANY_BYTES" -lt 1048576 ]; then
            echo "Company seat too small ($COMPANY_BYTES). Cook refused to publish."
            exit 1
          fi
          DISTRICT_N=$(find /tmp/packs/seat/district -name current.sqlite | wc -l | tr -d ' ')
          STORE_N=$(find /tmp/packs/seat/store -name current.sqlite | wc -l | tr -d ' ')
          echo "seat districts=$DISTRICT_N stores=$STORE_N"
          if [ "$DISTRICT_N" -lt 1 ] || [ "$STORE_N" -lt 1 ]; then
            echo "Cook must write every district and store seat sqlite."
            exit 1
          fi

      - name: Ensure aws CLI for R2
        if: env.skip != '1'
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          aws --version

      - name: Publish company LIVE to R2
        if: env.skip != '1'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          chmod +x Tools/HeartbeatIngest/publish-cloud.sh scripts/publish-r2.sh
          Tools/HeartbeatIngest/publish-cloud.sh company /tmp/current.sqlite
          echo "company_live=1" >> "$GITHUB_ENV"

      - name: Publish seat packs to R2
        if: env.skip != '1'
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SEAT_JOBS: "16"
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/publish-cloud.sh seats /tmp/current.sqlite
