name: Cook Heartbeat pack

# Turns Heartbeat Daily Report.xlsx in Supabase into current.sqlite.
# Testers never parse Excel. Cory's Mac does not need to be on.
# Soft KEEP thin company ≤40MB with slim picker_scorecard + pick_path_picker as LIVE.
# Soft FAIL fat over 40MB. Never drop ScoreCard facts. Never use needs_attention.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  cook:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download workbook from Supabase
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":50}' \
            "$PROJECT/storage/v1/object/list/heartbeat-packs" > /tmp/bucket.json
          python3 - <<'PY'
          import json, os
          rows = json.load(open("/tmp/bucket.json"))
          files = {r["name"]: r for r in rows}
          xlsx = files.get("Heartbeat Daily Report.xlsx")
          pack = files.get("current.sqlite")
          if not xlsx:
              raise SystemExit("No Heartbeat Daily Report.xlsx in the bucket.")
          xlsx_updated = xlsx.get("updated_at") or ""
          pack_updated = (pack or {}).get("updated_at") or ""
          force = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          print(f"xlsx {xlsx_updated} sqlite {pack_updated} force={force}")
          if not force and pack_updated and xlsx_updated <= pack_updated:
              open("/tmp/skip", "w").write("1")
              print("Pack is already newer than the workbook. Skip.")
          PY
          if [ -f /tmp/skip ]; then
            echo "skip=1" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sS -L -o /tmp/daily.xlsx \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            "$PROJECT/storage/v1/object/public/heartbeat-packs/Heartbeat%20Daily%20Report.xlsx"
          ls -l /tmp/daily.xlsx

      - name: Build kitchen
        if: env.skip != '1'
        run: |
          set -euo pipefail
          INGEST=Tools/HeartbeatIngest
          mkdir -p "$INGEST/Sources"
          cp FulfillmentHeartbeat/Models/Domain.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/Storage/WorkbookParser.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/Storage/PulseSQLite.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/Storage/PulseCaches.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/BuildStamp.swift "$INGEST/Sources/"
          cp Tools/HeartbeatIngest/Ingest.swift "$INGEST/Sources/"
          cp Tools/HeartbeatIngest/RollupMarketFill.swift "$INGEST/Sources/"
          cd "$INGEST"
          swift build -c release

      - name: Cook sqlite pack
        if: env.skip != '1'
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/.build/release/HeartbeatIngest /tmp/daily.xlsx /tmp/current.sqlite
          ls -l /tmp/current.sqlite

      - name: Soft KEEP thin company (keep slim ScoreCard + path picker)
        if: env.skip != '1'
        run: |
          set -euo pipefail
          # Fat market Soft FAIL over 40MB company seat. Soft KEEP slim company LIVE.
          # Soft KEEP picker_scorecard facts (slim). Soft KEEP stamped pick_path_picker.
          # Soft FAIL fat: drop pre_sub_oos_item only. Never drop ScoreCard. No needs_attention.
          FAT_BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          echo "fat $FAT_BYTES"
          python3 Tools/HeartbeatIngest/thin_company.py /tmp/current.sqlite
          THIN_BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          echo "thin $THIN_BYTES"
          if [ "$THIN_BYTES" -gt 40000000 ]; then
            echo "Soft FAIL: thin still too large ($THIN_BYTES) — company seat cap 40MB"
            exit 1
          fi
          SCORE_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='picker_scorecard';")
          PICKER_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='pick_path_picker';")
          echo "picker_scorecard=$SCORE_N pick_path_picker=$PICKER_N"
          if [ "$SCORE_N" -lt 1000 ]; then
            echo "Soft FAIL: picker_scorecard=$SCORE_N"
            exit 1
          fi
          if [ "$PICKER_N" -lt 1 ]; then
            echo "Soft FAIL: pick_path_picker=0"
            exit 1
          fi

      - name: Publish current.sqlite
        if: env.skip != '1'
        env:
          PROJECT: https://pcnjujfmlsklhrosxzlt.supabase.co
          KEY: sb_publishable_T3Pzm01sMXCv2rQaCeP_Kg_4ao2M5zd
        run: |
          set -euo pipefail
          BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          if [ "$BYTES" -lt 50000 ]; then
            echo "Pack too small ($BYTES)"
            exit 1
          fi
          if [ "$BYTES" -gt 40000000 ]; then
            echo "Soft FAIL: refusing publish over 40MB ($BYTES)"
            exit 1
          fi
          SCORE_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='picker_scorecard';")
          PICKER_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='pick_path_picker';")
          if [ "$SCORE_N" -lt 1000 ]; then
            echo "Soft FAIL: picker_scorecard=$SCORE_N — not publishing"
            exit 1
          fi
          if [ "$PICKER_N" -lt 1 ]; then
            echo "Soft FAIL: pick_path_picker=0 — not publishing"
            exit 1
          fi
          upload() {
            local path="$1"
            local code
            code=$(curl -sS -o /tmp/up.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary @/tmp/current.sqlite \
              "$PROJECT/storage/v1/object/heartbeat-packs/$path")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              code=$(curl -sS -o /tmp/up.txt -w "%{http_code}" \
                -X PUT \
                -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
                -H "Content-Type: application/octet-stream" \
                -H "x-upsert: true" \
                --data-binary @/tmp/current.sqlite \
                "$PROJECT/storage/v1/object/heartbeat-packs/$path")
            fi
            echo "upload $path $code"
            cat /tmp/up.txt
            echo
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              exit 1
            fi
          }
          upload "packs/seat/company/all/current.sqlite"
          upload "current.sqlite"
          echo "Published thin company current.sqlite ($BYTES bytes) picker_scorecard=$SCORE_N pick_path_picker=$PICKER_N."
