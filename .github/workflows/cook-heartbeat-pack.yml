name: Cook Heartbeat pack

# The GitHub repo is public, so the workbook is not a release asset.
# It lives in the private R2 bucket heartbeat-workbook (no r2.dev domain).
# This workflow reads and writes that bucket with the existing R2 secrets.
# Packs still publish to the public bucket in R2_BUCKET.
# Freshness compares the private object's ETag, Last-Modified, and size to
# packs/workbook-cooked.json in that same private bucket. Unchanged cooks skip.
# Supabase is not contacted.
# Testers never parse Excel. Cory's Mac does not need to stay on after upload.
# Company LIVE (current.sqlite + company seat key) publishes before seats.
# District/store seats are optional on this tip — continue if the cook
# did not write a seat plane.
# Company seat KEEP: sales/roster/chrome, slim ScoreCard facts, Loss bind, store grains.
# Slim pick_path_picker stays in the company seat (never dropped for size). Soft KEEP store_number from Excel/ScoreCard LDAP.
# DROP item tape / fat shopper payloads / 56MB hub.
# Soft FAIL >40MB, orphan chrome (shoppers cited / 0 ScoreCard facts), Haggen-only Loss,
# Path picker empty store when LDAP/store grain exists.
# Soft FAIL when the full cook had pick_path_picker rows and the thinned pack has 0,
# or when more than 5% of scorecard divisions have no path rows. Last good pack stays live.
# Soft FAIL invent Prep / 5★.
# Soft FAIL prep_not_ready mean > 20 or ≥50% of rows == 100 (Hours % blank must not become Store #).
# Soft WARN dynacap East hole: Jewel+Mid-Atlantic+Shaws is 0 while roster has those divisions. Does not block publish.
# Do not invent East rows. Cook/thin only. Do not conflate into tip 439. Never use needs_attention.
on:
  workflow_dispatch:
  schedule:
    # 8:00 AM–5:45 PM America/Chicago weekdays (CDT = UTC-5 → 13:00–22:45 UTC)
    - cron: "*/15 13-22 * * 1-5"

permissions:
  contents: read

jobs:
  cook:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Ensure aws CLI for R2
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          aws --version

      - name: Download workbook from private R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          WORKBOOK_BUCKET: heartbeat-workbook
          WORKBOOK_KEY: Heartbeat Daily Report.xlsx
          MARKER_KEY: packs/workbook-cooked.json
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-auto}"
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED
          export AWS_RESPONSE_CHECKSUM_VALIDATION=WHEN_REQUIRED
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if [ "$WORKBOOK_BUCKET" = "heartbeat-packs" ]; then
            echo "Refusing to read the workbook from the public packs bucket."
            exit 1
          fi
          set +e
          aws s3api head-object \
            --bucket "$WORKBOOK_BUCKET" \
            --key "$WORKBOOK_KEY" \
            --endpoint-url "$ENDPOINT" > /tmp/workbook-head.json 2> /tmp/workbook-head.err
          HEAD_STATUS=$?
          set -e
          if [ "$HEAD_STATUS" -ne 0 ]; then
            if grep -Eq '404|Not Found|NoSuchKey' /tmp/workbook-head.err; then
              echo "No workbook in private bucket $WORKBOOK_BUCKET yet. Skip cook."
              echo "skip=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Could not read s3://${WORKBOOK_BUCKET}/${WORKBOOK_KEY}."
            cat /tmp/workbook-head.err
            exit 1
          fi
          aws s3 cp "s3://${WORKBOOK_BUCKET}/${MARKER_KEY}" /tmp/workbook-cooked.json \
            --endpoint-url "$ENDPOINT" || true
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "Tools/HeartbeatIngest")
          from pack_freshness import same_workbook

          head = json.load(open("/tmp/workbook-head.json"))
          asset = {
              "id": head.get("ETag") or "",
              "updated_at": head.get("LastModified") or "",
              "size": head.get("ContentLength") or 0,
          }
          json.dump(asset, open("/tmp/workbook-asset.json", "w"))
          marker = None
          if os.path.isfile("/tmp/workbook-cooked.json"):
              try:
                  marker = json.load(open("/tmp/workbook-cooked.json"))
              except json.JSONDecodeError:
                  marker = None
          print(
              f"workbook id={asset['id']} updated_at={asset['updated_at']} "
              f"size={asset['size']} marker={marker}"
          )
          if same_workbook(marker, asset):
              open("/tmp/skip", "w").write("1")
              print("Workbook matches packs/workbook-cooked.json. Skip cook.")
          PY
          if [ -f /tmp/skip ]; then
            echo "skip=1" >> "$GITHUB_ENV"
            exit 0
          fi
          aws s3 cp "s3://${WORKBOOK_BUCKET}/${WORKBOOK_KEY}" /tmp/daily.xlsx \
            --endpoint-url "$ENDPOINT"
          ls -l /tmp/daily.xlsx

      - name: Build kitchen
        if: env.skip != '1'
        run: |
          set -euo pipefail
          INGEST=Tools/HeartbeatIngest
          mkdir -p "$INGEST/Sources"
          cp FulfillmentHeartbeat/Models/Domain.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/Storage/WorkbookParser.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/Storage/PulseSQLite.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/Storage/PulseCaches.swift "$INGEST/Sources/"
          cp FulfillmentHeartbeat/BuildStamp.swift "$INGEST/Sources/"
          cp Tools/HeartbeatIngest/Ingest.swift "$INGEST/Sources/"
          cp Tools/HeartbeatIngest/RollupMarketFill.swift "$INGEST/Sources/"
          cd "$INGEST"
          swift build -c release

      - name: Cook sqlite pack
        if: env.skip != '1'
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/.build/release/HeartbeatIngest /tmp/daily.xlsx /tmp/current.sqlite
          ls -l /tmp/current.sqlite
          python3 Tools/HeartbeatIngest/refuse_prep_east.py /tmp/current.sqlite

      - name: Soft KEEP thin company (ScoreCard facts, ≤40MB)
        if: env.skip != '1'
        run: |
          set -euo pipefail
          FAT_BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          echo "fat $FAT_BYTES"
          if [ "$FAT_BYTES" -gt 56000000 ]; then
            echo "market fat=$FAT_BYTES (expected). Company hub must thin to ≤40MB (D3)."
          fi
          PATH_BEFORE=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='pick_path_picker';")
          echo "PATH_BEFORE=$PATH_BEFORE" >> "$GITHUB_ENV"
          python3 Tools/HeartbeatIngest/thin_company.py /tmp/current.sqlite
          PATH_BEFORE="$PATH_BEFORE" python3 Tools/HeartbeatIngest/thin_company.py --check /tmp/current.sqlite
          THIN_BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          echo "thin $THIN_BYTES"
          if [ "$THIN_BYTES" -gt 40000000 ]; then
            echo "Soft FAIL: thin still too large ($THIN_BYTES) — company seat cap 40MB"
            exit 1
          fi
          SCORE_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='picker_scorecard';")
          CHROME_N=$(sqlite3 /tmp/current.sqlite "SELECT json_extract(json,'\$.pickerShoppers') FROM dash_chrome WHERE id=1;")
          echo "picker_scorecard=$SCORE_N chrome_pickerShoppers=$CHROME_N"
          if [ "$SCORE_N" -lt 1000 ]; then
            echo "Soft FAIL: picker_scorecard=$SCORE_N"
            exit 1
          fi
          if [ "${CHROME_N:-0}" -gt 0 ] && [ "$SCORE_N" -lt 1 ]; then
            echo "Soft FAIL: orphan chrome cites $CHROME_N shoppers with 0 ScoreCard facts"
            exit 1
          fi
          PATH_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='pick_path_picker';")
          PATH_BLANK=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='pick_path_picker' AND TRIM(COALESCE(store_number,''))='' AND TRIM(COALESCE(json_extract(text_json,'\$.shopper_id'),''))!='' AND json_extract(text_json,'\$.shopper_id') IN (SELECT json_extract(text_json,'\$.shopper_id') FROM facts WHERE section='picker_scorecard' AND TRIM(COALESCE(store_number,''))!='');")
          echo "pick_path_picker=$PATH_N ldap_store_blank=$PATH_BLANK"
          if [ "$PATH_N" -gt 0 ] && [ "$PATH_BLANK" -gt 0 ]; then
            echo "Soft FAIL: pick_path_picker store_number empty on $PATH_BLANK LDAP rows with ScoreCard store grain"
            exit 1
          fi
          PATH_BEFORE="${PATH_BEFORE:-0}" python3 Tools/HeartbeatIngest/thin_company.py --check /tmp/current.sqlite

      - name: Publish company LIVE to R2
        if: env.skip != '1'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          BYTES=$(wc -c < /tmp/current.sqlite | tr -d ' ')
          if [ "$BYTES" -lt 50000 ]; then
            echo "Pack too small ($BYTES)"
            exit 1
          fi
          if [ "$BYTES" -gt 40000000 ]; then
            echo "Soft FAIL: refusing publish over 40MB ($BYTES)"
            exit 1
          fi
          SCORE_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='picker_scorecard';")
          CHROME_N=$(sqlite3 /tmp/current.sqlite "SELECT json_extract(json,'\$.pickerShoppers') FROM dash_chrome WHERE id=1;")
          if [ "$SCORE_N" -lt 1000 ]; then
            echo "Soft FAIL: picker_scorecard=$SCORE_N — not publishing"
            exit 1
          fi
          if [ "${CHROME_N:-0}" -gt 0 ] && [ "$SCORE_N" -lt 1 ]; then
            echo "Soft FAIL: orphan chrome cites $CHROME_N shoppers with 0 ScoreCard facts — not publishing"
            exit 1
          fi
          PATH_N=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='pick_path_picker';")
          PATH_BLANK=$(sqlite3 /tmp/current.sqlite "SELECT COUNT(*) FROM facts WHERE section='pick_path_picker' AND TRIM(COALESCE(store_number,''))='' AND TRIM(COALESCE(json_extract(text_json,'\$.shopper_id'),''))!='' AND json_extract(text_json,'\$.shopper_id') IN (SELECT json_extract(text_json,'\$.shopper_id') FROM facts WHERE section='picker_scorecard' AND TRIM(COALESCE(store_number,''))!='');")
          if [ "$PATH_N" -gt 0 ] && [ "$PATH_BLANK" -gt 0 ]; then
            echo "Soft FAIL: pick_path_picker store_number empty on $PATH_BLANK LDAP rows with ScoreCard store grain — not publishing"
            exit 1
          fi
          PATH_BEFORE="${PATH_BEFORE:-0}" python3 Tools/HeartbeatIngest/thin_company.py --check /tmp/current.sqlite
          python3 Tools/HeartbeatIngest/refuse_prep_east.py /tmp/current.sqlite
          chmod +x Tools/HeartbeatIngest/publish-cloud.sh scripts/publish-r2.sh
          Tools/HeartbeatIngest/publish-cloud.sh company /tmp/current.sqlite
          echo "Published thin company current.sqlite ($BYTES bytes) picker_scorecard=$SCORE_N chrome_pickerShoppers=$CHROME_N."

      - name: Publish seat packs to R2
        if: env.skip != '1'
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SEAT_JOBS: "16"
        run: |
          set -euo pipefail
          Tools/HeartbeatIngest/publish-cloud.sh seats /tmp/current.sqlite

      - name: Record cooked workbook marker
        if: env.skip != '1'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: heartbeat-workbook
          R2_CACHE_CONTROL: private, no-store
        run: |
          set -euo pipefail
          if [ "$R2_BUCKET" = "heartbeat-packs" ]; then
            echo "Refusing to store the workbook marker on the public packs bucket."
            exit 1
          fi
          chmod +x scripts/publish-r2.sh
          ./scripts/publish-r2.sh /tmp/workbook-asset.json packs/workbook-cooked.json application/json
