# Heartbeat web. Cloudflare Pages, free tier. Do not put an account_id here.
# Deploy steps: web/DEPLOY.md. This file does not create resources by itself.
# The existing heartbeat-web Pages project is an unrelated site. Do not deploy there.
name = "fulfillment-heartbeat-web"
compatibility_date = "2026-09-28"
pages_build_output_dir = "dist"

# Pages replaces top-level bindings with the matching env block.
# Every block repeats R2 and D1 so a deploy keeps HEARTBEAT_PACKS.
[[r2_buckets]]
binding = "HEARTBEAT_PACKS"
bucket_name = "heartbeat-packs"

# Production accounts. Preview uses hb-auth-preview, not this database.
[[d1_databases]]
binding = "HB_AUTH"
database_name = "fulfillment-heartbeat-auth"
database_id = "646c017a-802f-4395-b635-d4b5bd66c1cb"
preview_database_id = "291dfe6d-fcc1-4b15-90c7-768db26d1f8e"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "HEARTBEAT_PACKS"
bucket_name = "heartbeat-packs"

[[env.production.d1_databases]]
binding = "HB_AUTH"
database_name = "fulfillment-heartbeat-auth"
database_id = "646c017a-802f-4395-b635-d4b5bd66c1cb"

[[env.preview.r2_buckets]]
binding = "HEARTBEAT_PACKS"
bucket_name = "heartbeat-packs"

[[env.preview.d1_databases]]
binding = "HB_AUTH"
database_name = "hb-auth-preview"
database_id = "291dfe6d-fcc1-4b15-90c7-768db26d1f8e"
